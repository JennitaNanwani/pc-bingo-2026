<!DOCTYPE html>

  @import url('https://fonts.googleapis.com/css2?family=72:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #00144A;
    font-family: '72', 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 32px 36px;
    width: 100%;
    max-width: 520px;
  }

  /* SAP Logo */
  .sap-logo {
    width: 120px;
    height: auto;
  }

  /* Title block */
  .title-block {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .title-block h1 {
    color: #FFFFFF;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1.2;
  }

  .title-block .subtitle {
    color: #4CB1FF;
    font-size: clamp(14px, 2.2vw, 18px);
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  /* QR card */
  .qr-card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  }

  #qrcode canvas,
  #qrcode img {
    display: block;
    border-radius: 4px;
  }

  /* Bottom label */
  .scan-label {
    color: rgba(255,255,255,0.82);
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 400;
    letter-spacing: 0.3px;
    text-align: center;
  }

  /* Top accent bar */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #0070F2 0%, #4CB1FF 100%);
  }

  /* Bottom accent bar */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #0070F2 0%, #4CB1FF 100%);
  }
</style>
</head>
